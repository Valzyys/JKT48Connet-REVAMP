name: Deploy ke Cloudflare

# Butuh repository secrets:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   JKT48CONNECT_API_KEY   (jkc_… dari https://api.jkt48connect.app/dashboard/keys)
# Opsional (Settings → Variables): VITE_TURNSTILE_SITE_KEY untuk mengaktifkan Turnstile di build.
# SESSION_SECRET & TURNSTILE_SECRET_KEY disimpan sekali lewat `wrangler secret put` (tidak perlu di workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# Token GITHUB_TOKEN hanya baca.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker + secret API key
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JKT48CONNECT_API_KEY
        env:
          JKT48CONNECT_API_KEY: ${{ secrets.JKT48CONNECT_API_KEY }}
