name: Deploy ke Cloudflare

# Butuh repository secrets:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   JKT48CONNECT_API_KEY   (jkc_… dari https://api.jkt48connect.app/dashboard/keys)
# Opsional (Settings → Variables): VITE_TURNSTILE_SITE_KEY untuk mengaktifkan Turnstile di build.
# Opsional (Secrets): TURNSTILE_SECRET_KEY. SESSION_SECRET dibuat otomatis oleh scripts/deploy.mjs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# Token GITHUB_TOKEN hanya baca.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build + deploy + Durable Object + secret otomatis (scripts/deploy.mjs).
      - name: Deploy otomatis
        run: npm run deploy:auto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JKT48CONNECT_API_KEY: ${{ secrets.JKT48CONNECT_API_KEY }}
          # Opsional: server push ke aplikasi Android (README → Server push). Kosong = dilewati.
          # Cukup dua secret berisi isi file dari Firebase: service account JSON dan google-services.json.
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          FCM_GOOGLE_SERVICES: ${{ secrets.FCM_GOOGLE_SERVICES }}
          FCM_ANDROID_APP_ID: ${{ secrets.FCM_ANDROID_APP_ID }}
          FCM_ANDROID_API_KEY: ${{ secrets.FCM_ANDROID_API_KEY }}
          PM_API_KEY: ${{ secrets.PM_API_KEY }}
          MYPG_API_KEY: ${{ secrets.MYPG_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
