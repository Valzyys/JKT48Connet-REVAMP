name: Mobile Release

# Build APK Android lalu unggah sebagai GitHub Release.
# Jalan saat kode mobile berubah di main, saat tag mobile-v* di-push, atau manual dari tab Actions.
on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
    paths: ["mobile/**", ".github/workflows/mobile-release.yml"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Alamat situs yang melayani /api/app (kosong = variabel repo API_BASE)"
        required: false
        default: ""

# Perlu tulis untuk membuat release.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Kunci rilis tetap dari secret ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (lihat mobile/README.md);
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD opsional (bawaan: jkt48connect / password keystore). Tanpa kunci ini tiap build memakai kunci
      # debug acak dari runner, sehingga APK baru tidak bisa memperbarui yang lama (harus hapus-pasang). Karena itu rilis
      # dihentikan bila secret belum ada: lebih baik tidak ada rilis daripada rilis yang memaksa pengguna hapus-pasang.
      - name: Kunci tanda tangan rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Kunci rilis belum diatur::Tambahkan secret ANDROID_KEYSTORE_BASE64 dan ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions), lalu jalankan ulang workflow ini. Tanpa kunci tetap, APK tidak bisa memperbarui versi lama (harus hapus-pasang). Lihat mobile/README.md → Kunci tanda tangan rilis."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null \
            || { echo "::error title=Kunci rilis tidak valid::ANDROID_KEYSTORE_BASE64 tidak bisa dibuka dengan ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # JDK 17 dan Android SDK sudah ada di runner; platform yang kurang diunduh otomatis oleh Gradle.
      - name: Build APK
        env:
          API_BASE: ${{ inputs.api_base || vars.API_BASE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/jkt48connect.apk"
      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="mobile-build-$GITHUB_RUN_NUMBER"; fi
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Catatan rilis = pesan commit (tampil di pop-up update aplikasi), tanpa trailer.
          {
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA" | grep -vE '^(Co-Authored-By|Claude-Session|Signed-off-by):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo "---"
            echo "Pasang dengan mengizinkan instalasi dari sumber tidak dikenal. Commit: $GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          # Release "latest" (bukan prerelease) dibaca /api/app/update; aplikasi menawarkan update bila
          # versionName di judul lebih baru dari versinya sendiri.
          gh release create "$tag" "$RUNNER_TEMP/jkt48connect.apk" \
            --target "$GITHUB_SHA" --latest \
            --title "JKT48Connect Android $version ($tag)" \
            --notes-file "$RUNNER_TEMP/notes.md"
