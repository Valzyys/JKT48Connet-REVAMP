name: Stream Android Release

on:
  push:
    branches: [main, codex/jkt48connect-stream]
    paths: ["stream-mobile/**", "stream-backend/**", ".github/workflows/stream-mobile-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stream-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate backend
        working-directory: stream-backend
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/stream-release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/stream-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release and UI review APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:assembleDebug -PapiBase=https://stream.jkt48connect.app
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/JKT48Connect-Stream-v1.0.0.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/JKT48Connect-Stream-review.apk"
      - name: Publish separate Stream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stream-mobile-build-$GITHUB_RUN_NUMBER"
          cat > "$RUNNER_TEMP/stream-notes.md" <<'NOTES'
          Aplikasi Android JKT48Connect Stream, package terpisah app.jkt48connect.stream.

          Unduh JKT48Connect-Stream-v1.0.0.apk untuk pemasangan. File review hanya untuk pemeriksaan UI, bukan distribusi produksi.

          Akun password lama, akses dan riwayat pembelian telah diimpor. Akun OAuth tanpa password masih memerlukan konfigurasi penyedia/pemulihan. Pembayaran diproses server setelah aplikasi ditutup; push FCM khusus package baru belum dikonfigurasi.
          NOTES
          gh release create "$tag" "$RUNNER_TEMP/JKT48Connect-Stream-v1.0.0.apk" "$RUNNER_TEMP/JKT48Connect-Stream-review.apk" --target "$GITHUB_SHA" --latest=false --title "JKT48Connect Stream 1.0.0 ($tag)" --notes-file "$RUNNER_TEMP/stream-notes.md"
