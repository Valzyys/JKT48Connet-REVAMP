name: Mobile

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches-ignore: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

# Token GITHUB_TOKEN hanya baca.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # JDK 17 dan Android SDK sudah ada di runner; platform yang kurang diunduh otomatis oleh Gradle.
      - name: Build APK rilis (compile + R8)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Ukuran APK
        run: ls -la app/build/outputs/apk/release/
