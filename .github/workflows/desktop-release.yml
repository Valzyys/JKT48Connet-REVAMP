name: Desktop Release

# Installer Windows JKT48Connect di setiap perubahan desktop/ pada main:
# - GitHub Release "desktop-build-N" (arsip per build);
# - prerelease tetap "desktop-latest": JKT48Connect-Setup.exe (+ .blockmap) dan latest.yml dengan URL yang tidak
#   pernah berubah. Tombol unduh di jkt48connect.app/apps dan update otomatis aplikasi (electron-updater) membaca ini.
# Keduanya TIDAK ditandai "latest": releases/latest tetap menunjuk rilis APK Android.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/lib/shape.ts", "src/lib/format.ts", ".github/workflows/desktop-release.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Versi = mayor.minor dari package.json + nomor build, supaya update otomatis mengenali versi baru.
      - name: Versi
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "VERSION=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          npm version "$base.$GITHUB_RUN_NUMBER" --no-git-tag-version --allow-same-version
      - run: npm run dist
      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA" | grep -vE '^(Co-Authored-By|Claude-Session|Signed-off-by):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo "---"
            echo "Installer Windows 10/11 (64-bit). Unduh JKT48Connect-Setup.exe lalu jalankan. Aplikasi memperbarui dirinya sendiri. Panduan: desktop/README.md. Commit: $GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "desktop-build-$GITHUB_RUN_NUMBER" dist/JKT48Connect-Setup.exe \
            --target "$GITHUB_SHA" --latest=false \
            --title "JKT48Connect Windows $VERSION (build $GITHUB_RUN_NUMBER)" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Perbarui desktop-latest (URL tetap + update otomatis)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "JKT48Connect Windows (terbaru)" \
            --notes "URL tetap installer Windows: …/desktop-latest/JKT48Connect-Setup.exe. latest.yml dibaca update otomatis aplikasi."
          gh release upload desktop-latest dist/JKT48Connect-Setup.exe dist/JKT48Connect-Setup.exe.blockmap dist/latest.yml --clobber
          gh release edit desktop-latest --title "JKT48Connect Windows $VERSION (terbaru)" --prerelease --latest=false
