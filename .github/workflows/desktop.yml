name: Desktop

# Aplikasi Windows (desktop/): tes, build UI, dan installer .exe di setiap PR/cabang yang mengubahnya.
# Installer diunggah sebagai artifact untuk dicoba sebelum digabung.
on:
  pull_request:
    paths: ["desktop/**", "src/lib/shape.ts", "src/lib/format.ts", ".github/workflows/desktop*.yml"]
  push:
    branches-ignore: [main]
    paths: ["desktop/**", "src/lib/shape.ts", "src/lib/format.ts", ".github/workflows/desktop*.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JKT48Connect-Setup
          path: desktop/dist/JKT48Connect-Setup.exe
          retention-days: 14
